create:
  name: Create alarm
  description: Create a Scheduler-backed alarm for a configured Assist satellite endpoint.
  fields:
    endpoint_id:
      name: Endpoint
      required: true
      selector:
        config_entry:
          integration: assist_satellite_alarms
    time:
      name: Time
      required: true
      selector:
        time:
    recurrence:
      name: Recurrence
      default: once
      selector:
        select:
          options:
            - label: One time
              value: once
            - label: Daily
              value: daily
            - label: Weekdays
              value: weekdays
            - label: Weekends
              value: weekends
            - label: Selected days
              value: selected_days
    days:
      name: Days
      description: Weekdays used when recurrence is Selected days.
      selector:
        select:
          multiple: true
          options:
            - label: Monday
              value: mon
            - label: Tuesday
              value: tue
            - label: Wednesday
              value: wed
            - label: Thursday
              value: thu
            - label: Friday
              value: fri
            - label: Saturday
              value: sat
            - label: Sunday
              value: sun
    date:
      name: Date
      description: Optional date for a one-time alarm. If omitted, the next occurrence of the requested time is used.
      selector:
        date:
    name:
      name: Name
      selector:
        text:

update:
  name: Update alarm
  description: Update an existing Satellite Alarm.
  fields:
    alarm_id:
      name: Alarm ID
      required: true
      selector:
        text:
    time:
      name: Time
      selector:
        time:
    recurrence:
      name: Recurrence
      selector:
        select:
          options:
            - label: One time
              value: once
            - label: Daily
              value: daily
            - label: Weekdays
              value: weekdays
            - label: Weekends
              value: weekends
            - label: Selected days
              value: selected_days
    days:
      name: Days
      description: Weekdays used when recurrence is Selected days.
      selector:
        select:
          multiple: true
          options:
            - label: Monday
              value: mon
            - label: Tuesday
              value: tue
            - label: Wednesday
              value: wed
            - label: Thursday
              value: thu
            - label: Friday
              value: fri
            - label: Saturday
              value: sat
            - label: Sunday
              value: sun
    date:
      name: Date
      selector:
        date:
    name:
      name: Name
      selector:
        text:

list:
  name: List alarms
  description: List Satellite Alarms, optionally scoped to one configured endpoint.
  fields:
    endpoint_id:
      name: Endpoint
      description: Optional configured endpoint. Omit to list alarms from all endpoints.
      selector:
        config_entry:
          integration: assist_satellite_alarms

delete:
  name: Delete alarm
  description: Delete an alarm and its Scheduler Component schedule.
  fields:
    alarm_id:
      name: Alarm ID
      required: true
      selector:
        text:

enable:
  name: Enable alarm
  description: Enable an existing alarm.
  fields:
    alarm_id:
      name: Alarm ID
      required: true
      selector:
        text:

disable:
  name: Disable alarm
  description: Disable an existing alarm without deleting it.
  fields:
    alarm_id:
      name: Alarm ID
      required: true
      selector:
        text:

fire:
  name: Trigger alarm
  description: Internal action used by Scheduler Component when an alarm becomes due.
  fields:
    alarm_id:
      name: Alarm ID
      required: true
      selector:
        text:

stop:
  name: Stop alarm
  description: Stop the currently ringing alarm and restore the previous media-player volume.
  fields:
    alarm_id:
      name: Alarm ID
      description: Stable alarm ID. Provide either Alarm ID or Endpoint.
      selector:
        text:
    endpoint_id:
      name: Endpoint
      description: Configured Satellite Alarms endpoint. Provide either Endpoint or Alarm ID.
      selector:
        config_entry:
          integration: assist_satellite_alarms

snooze:
  name: Snooze alarm
  description: Stop the currently ringing alarm and create a temporary one-time Scheduler occurrence.
  fields:
    alarm_id:
      name: Alarm ID
      description: Stable alarm ID. Provide either Alarm ID or Endpoint.
      selector:
        text:
    endpoint_id:
      name: Endpoint
      description: Configured Satellite Alarms endpoint. Provide either Endpoint or Alarm ID.
      selector:
        config_entry:
          integration: assist_satellite_alarms
    minutes:
      name: Minutes
      description: Snooze duration. If omitted, the endpoint default is used.
      selector:
        number:
          min: 1
          max: 120
          step: 1
          mode: box
