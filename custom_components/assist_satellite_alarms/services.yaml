list:
  name: List alarms
  description: List Satellite Alarms, optionally scoped to one configured endpoint.
  fields:
    endpoint_id:
      name: Endpoint
      description: Optional configured endpoint. Omit to list alarms from all endpoints.
      selector:
        config_entry:
          integration: assist_satellite_alarms

delete:
  name: Delete alarm
  description: Delete an alarm and its Scheduler Component schedule.
  fields:
    alarm_id:
      name: Alarm ID
      required: true
      selector:
        text:

enable:
  name: Enable alarm
  description: Enable an existing alarm.
  fields:
    alarm_id:
      name: Alarm ID
      required: true
      selector:
        text:

disable:
  name: Disable alarm
  description: Disable an existing alarm without deleting it.
  fields:
    alarm_id:
      name: Alarm ID
      required: true
      selector:
        text:

skip_next:
  name: Skip next occurrence
  description: Skip the next normal occurrence without changing the recurring schedule.
  fields:
    alarm_id:
      name: Alarm ID
      required: true
      selector:
        text:

override_next:
  name: Override next occurrence
  description: Temporarily move the next occurrence to another date/time while preserving recurrence.
  fields:
    alarm_id:
      name: Alarm ID
      required: true
      selector:
        text:
    time:
      name: Time
      required: true
      selector:
        time:
    date:
      name: Date
      description: Optional target date. If omitted, the current next-occurrence date is used.
      selector:
        date:

fire:
  name: Trigger alarm
  description: Internal action used by Scheduler Component when an alarm becomes due.
  fields:
    alarm_id:
      name: Alarm ID
      required: true
      selector:
        text:
    occurrence:
      name: Occurrence type
      description: Internal occurrence type used for parent, snooze, and override callbacks.
      selector:
        select:
          options:
            - scheduled
            - snooze
            - override
    occurrence_id:
      name: Occurrence ID
      description: Internal transient occurrence identifier.
      selector:
        text:

stop:
  name: Stop alarm
  description: Stop the currently ringing alarm and restore the previous media-player volume.
  fields:
    alarm_id:
      name: Alarm ID
      description: Stable alarm ID. Provide either Alarm ID or Endpoint.
      selector:
        text:
    endpoint_id:
      name: Endpoint
      description: Configured Satellite Alarms endpoint. Provide either Endpoint or Alarm ID.
      selector:
        config_entry:
          integration: assist_satellite_alarms

snooze:
  name: Snooze alarm
  description: Stop the currently ringing alarm and create a temporary one-time Scheduler occurrence.
  fields:
    alarm_id:
      name: Alarm ID
      description: Stable alarm ID. Provide either Alarm ID or Endpoint.
      selector:
        text:
    endpoint_id:
      name: Endpoint
      description: Configured Satellite Alarms endpoint. Provide either Endpoint or Alarm ID.
      selector:
        config_entry:
          integration: assist_satellite_alarms
    minutes:
      name: Minutes
      description: Snooze duration. If omitted, the endpoint default is used.
      selector:
        number:
          min: 1
          max: 120
          step: 1
          mode: box
