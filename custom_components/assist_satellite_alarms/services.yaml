create:
  name: Create alarm
  description: Create a Scheduler-backed alarm for a configured Assist satellite endpoint.
  fields:
    endpoint_id:
      name: Endpoint
      required: true
      selector:
        config_entry:
          integration: assist_satellite_alarms
    time:
      name: Time
      required: true
      selector:
        time:
    recurrence:
      name: Recurrence
      default: once
      selector:
        select:
          options:
            - label: One time
              value: once
            - label: Daily
              value: daily
            - label: Weekdays
              value: weekdays
            - label: Weekends
              value: weekends
            - label: Selected days
              value: selected_days
    days:
      name: Days
      description: Weekdays used when recurrence is Selected days.
      selector:
        select:
          multiple: true
          options:
            - label: Monday
              value: mon
            - label: Tuesday
              value: tue
            - label: Wednesday
              value: wed
            - label: Thursday
              value: thu
            - label: Friday
              value: fri
            - label: Saturday
              value: sat
            - label: Sunday
              value: sun
    date:
      name: Date
      description: Optional date for a one-time alarm. If omitted, the next occurrence of the requested time is used.
      selector:
        date:
    name:
      name: Name
      selector:
        text:
    alarm_media:
      name: Alarm media
      description: Optional per-alarm media URL or media-source ID. Leave empty to use the endpoint default.
      selector:
        text:
    alarm_volume:
      name: Alarm volume
      description: Optional per-alarm volume override from 0.0 to 1.0.
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
          mode: slider
    snooze_minutes:
      name: Snooze minutes
      description: Optional per-alarm default snooze duration.
      selector:
        number:
          min: 1
          max: 120
          step: 1
          mode: box
    pre_actions:
      name: Pre-alarm actions
      description: Optional list of simple Home Assistant service actions to run before ringing.
      selector:
        object:
    post_actions:
      name: Post-alarm actions
      description: Optional list of simple Home Assistant service actions to run after stop or timeout.
      selector:
        object:
    failure_actions:
      name: Failure actions
      description: Optional list of simple Home Assistant service actions to run if alarm playback cannot start.
      selector:
        object:

