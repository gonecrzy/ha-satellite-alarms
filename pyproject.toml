[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--cov=custom_components/satellite_alarms",
  "--cov-report=term-missing",
  "--cov-report=xml",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "E",
  "F",
  "I",
  "SIM",
  "UP",
]
ignore = [
  "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.satellite_alarms"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
